name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a quick follow-up commit makes an in-flight PR run irrelevant.
# Never cancel on main: that branch publishes a release, and killing it partway
# through `gh release create` would leave a tag with no assets behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Separate steps rather than one `npm run build`, so a red run names the thing
      # that broke instead of just "build failed".
      - name: Validate the dataset
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # The build cannot catch these: crxjs generates the manifest, and both a broad
      # host permission and an unbundled page are silent successes at build time.
      - name: Check the built manifest
        run: npm run check:manifest

      # The <all_urls> variant shares every source file with the scoped build and differs
      # only in one manifest field, so nothing but its own build step will notice when it
      # stops building. `check:manifest:allhosts` also asserts the broad pattern is the
      # *only* one, which is what stops the variant quietly drifting into the worst of both.
      - name: Build the all-hosts variant
        run: npm run build:allhosts

      # The Firefox target builds from the same source; web-ext lint is the closest
      # thing to an AMO pre-check, so a broken Gecko manifest fails here, not at upload.
      - name: Build Firefox target
        run: npm run build:firefox

      - name: Lint Firefox (web-ext)
        run: npm run lint:firefox

      - name: Upload the unpacked extension
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The smoke tests load the built extension, so it has to exist first.
      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  release:
    needs: [test, e2e]
    # Push only. On a workflow_dispatch re-run of an already-released commit the tag
    # would already exist and `gh release create` would fail.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # pack-crx.mjs packages the built extension, so the build has to run first.
      - name: Build
        run: npm run build

      - name: Build the all-hosts variant
        run: npm run build:allhosts

      - name: Pack CRX + ZIP
        env:
          # Optional: a stable signing key (PEM, raw or base64). Without it an
          # ephemeral key is used and the extension id will not be stable.
          CRX_KEY: ${{ secrets.CRX_KEY }}
        run: npm run pack

      - name: Pack the all-hosts CRX + ZIP
        env:
          CRX_KEY: ${{ secrets.CRX_KEY }}
        run: npm run pack:allhosts

      - name: Compute release metadata
        id: meta
        run: |
          echo "tag=build-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release (tagged by commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            release/shabbat-closed-extension.crx \
            release/shabbat-closed-extension.zip \
            release/shabbat-closed-extension-allhosts.crx \
            release/shabbat-closed-extension-allhosts.zip \
            --target "${{ github.sha }}" \
            --title "v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.tag }})" \
            --notes "$(cat <<'NOTES'
          Automated build of commit ${{ github.sha }} (manifest v${{ steps.meta.outputs.version }}).

          **`shabbat-closed-extension.{crx,zip}`** — the build that ships. Runs only on the
          domains listed in `data/sites.json`.

          **`shabbat-closed-extension-allhosts.{crx,zip}`** — an evaluation build, **not for
          publishing**. Identical code and dataset, but its content script matches
          `<all_urls>` instead of the listed domains, so Chrome shows the broadest install
          warning. It still only shows a banner on listed sites — that narrowing is enforced
          by `banner.ts` rather than by the browser. It exists to measure whether adding
          domains between releases counts as a permission increase; see
          `ManifestOptions.allHosts` in `manifest.config.ts`.

          Both are signed with the same key and share one extension id, so installing one
          replaces the other.
          NOTES
          )"
