<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>preview</title>
    <style>
      body { margin: 24px; background: #d9d5cc; }
      .frame { width: 336px; box-shadow: 0 8px 30px rgba(0,0,0,.25); border-radius: 12px; overflow: hidden; }
    </style>
  </head>
  <body>
    <!--
      Dev-only. The popup is a TypeScript module now, so this page has to be served:
      run `npm run dev` and open /dev-preview/popup-preview.html. The chrome mock must be
      installed before the module is imported, hence the dynamic import at the end.
    -->
    <script>
      const store = {};
      window.chrome = {
        storage: {
          sync: {
            async get(defaults) { return Object.assign({}, defaults, store); },
            async set(patch) { Object.assign(store, patch); },
          },
          onChanged: { addListener() {} },
        },
        tabs: {
          async query() { return [{ id: 1, url: "https://www.togonline.co.il/" }]; },
        },
        runtime: {},
      };
    </script>
    <div class="frame" id="mount"></div>
    <script type="module">
      const html = await (await fetch("../src/popup/index.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const mount = document.getElementById("mount");
      for (const script of doc.body.querySelectorAll("script")) script.remove();
      mount.innerHTML = doc.body.innerHTML;

      // The popup module reads the DOM on import, so it must load after the mount.
      await import("../src/popup/popup.ts");
    </script>
  </body>
</html>
