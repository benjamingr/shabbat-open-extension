<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:440px;height:280px;overflow:hidden}
  .slide{width:440px;height:280px;overflow:hidden;
    font-family:"Assistant","Heebo","Segoe UI",system-ui,Arial,sans-serif;
    background:radial-gradient(600px 360px at 75% -20%,#4a3a80,#2a2350 60%,#191331);
    color:#f6f1dd;direction:rtl;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 26px}
  img{width:74px;height:74px;border-radius:18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  h1{font-size:34px;font-weight:800;line-height:1.1}
  .tag{font-size:16px;opacity:.85;margin-top:10px;line-height:1.35}
  .warn{color:#e6c14a;font-weight:700}
</style>
</head>
<body>
<div class="slide">
  <img src="../public/icons/icon128.png" alt="" />
  <h1>סגור בשבת</h1>
  <div class="tag"><span class="warn">⚠️</span> יודעים מראש אילו אתרים ישראליים סגורים בשבת</div>
</div>
</body>
</html>
